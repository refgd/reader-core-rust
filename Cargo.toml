[workspace]
members = [
    "crates/legado-runtime",
    "crates/legado-cli",
    "crates/legado-uniffi",
    "crates/legado-uniffi-bindgen",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
des = "0.8"
ego-tree = "0.6"
encoding_rs = "0.8"
hanconv = "0.5"
hex = "0.4"
hmac = "0.12"
lol_html = "2.9"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
md5 = "0.7"
percent-encoding = "2"
publicsuffix = "2.3"
rar = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "gzip", "brotli", "deflate", "json", "multipart", "rustls-tls", "socks"] }
rquickjs = { version = "0.8", features = ["full"] }
roxmltree = "0.20"
rsa = { version = "0.9", features = ["pem"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = "0.21"
thiserror = "1"
ttf-parser = "0.25"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
